# One-command deploy:  WEBSERVER_API_KEY=... docker compose up -d --build
# (or put WEBSERVER_API_KEY in a .env file next to this one).
#
# The five bind mounts map the host's secret/config/data files onto /app, so
# nothing sensitive lives in the image and the weekly puredns results persist
# across rebuilds. The host must grant uid 10001 access to these paths
# (see README.txt, setfacl section).

services:
  subdomain-api:
    build: .
    image: subdomain-api
    container_name: subdomain-api
    restart: unless-stopped
    init: true                      # reap zombies / forward signals (cron + gunicorn)
    environment:
      WEBSERVER_API_KEY: "${WEBSERVER_API_KEY:?set WEBSERVER_API_KEY in your shell or a .env file}"
      ENABLE_CRON: "true"
      # TZ: "Europe/Brussels"       # cron uses container time; default is UTC
      # RATE_LIMIT: "1000"
      # RATE_LIMIT_TRUSTED: "100"
      # WILDCARD_BATCH: "500000"
      # WILDCARD_TESTS: "5"
    ports:
      - "127.0.0.1:8001:8001"
      - "172.30.0.13:8001:8001"     # internal interface for n8n; adjust to your host
    volumes:
      - ./output:/app/output
      - ./provider-config.yaml:/app/provider-config.yaml:ro
      - ./resolvers.txt:/app/resolvers.txt:ro
      - ./wordlist.txt:/app/wordlist.txt:ro
      - ./domains.txt:/app/domains.txt:ro
