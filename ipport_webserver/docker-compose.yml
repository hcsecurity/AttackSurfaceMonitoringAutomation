services:
  nmap-ip-port-api:
    build:
      context: .
      args:
        PORT: "${PORT:-8000}"
    image: nmap-ip-port-api
    container_name: nmap-ip-port-api
    restart: unless-stopped
    environment:
      WEBSERVER_API_KEY: "${WEBSERVER_API_KEY:?set WEBSERVER_API_KEY in your shell or a .env file}"
      OUTPUT_DIR: "/app/output"
      # default timeout is unlimited since nmap can run for a long time
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-0}"
    # No NET_RAW or ICMP sysctl: the scanner uses nmap's TCP connect scan
    # (-sT), which needs no raw-socket capability.
    ports:
      # HOST_PORT maps to the in-container PORT.
      - "127.0.0.1:${HOST_PORT:-8000}:${PORT:-8000}"
      - "172.30.0.13:${HOST_PORT:-8000}:${PORT:-8000}"
    volumes:
      # Dated scan responses land here for logging. The host must grant uid
      # 10001 rwX on this dir (see README, ACL section).
      - "./output:/app/output"
