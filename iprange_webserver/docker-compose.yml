services:
  iprange-api:
    build:
      context: .
      args:
        PORT: "${PORT:-8000}"
    image: iprange-api
    container_name: iprange-api
    restart: unless-stopped
    environment:
      WEBSERVER_API_KEY: "${WEBSERVER_API_KEY:?set WEBSERVER_API_KEY in your shell or a .env file}"
      SHODAN_API_KEY: "${SHODAN_API_KEY:?set SHODAN_API_KEY in your shell or a .env file}"
      SCAN_DELAY: "${SCAN_DELAY:-1.0}"
      OUTPUT_DIR: "/app/output"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
    # Let the unprivileged scanner gid (10001) open ICMP sockets for the ping
    # follow-up without granting CAP_NET_RAW. If your host forbids this
    # sysctl, drop it and add `cap_add: [NET_RAW]` instead.
    sysctls:
      - "net.ipv4.ping_group_range=10001 10001"
    ports:
      # HOST_PORT maps to the in-container PORT.
      - "127.0.0.1:${HOST_PORT:-8000}:${PORT:-8000}"
      - "172.30.0.13:${HOST_PORT:-8000}:${PORT:-8000}"
    volumes:
      # Dated scan responses land here for logging. The host must grant uid
      # 10001 rwX on this dir (see README, ACL section).
      - "./output:/app/output"
